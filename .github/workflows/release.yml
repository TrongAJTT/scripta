name: Release Scripta

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
      - "v*"

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      discussions: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Quality Checks
        run: pnpm lint

      - name: Build Web Application & PWA
        run: pnpm build

      - name: Package Release Assets & Generate Checksums
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          echo "Packaging standalone release bundle for tag: ${TAG_NAME}"

          # Compress dist folder into standalone web archive
          cd dist
          zip -r "../scripta-${TAG_NAME}-web.zip" ./*
          cd ..

          echo "===================================================="
          echo "  OFFICIAL IMMUTABLE SHA-256 CHECKSUMS (LOG RECORD)"
          echo "===================================================="
          sha256sum scripta-${TAG_NAME}-web.zip | tee SHA256SUMS.txt
          echo "===================================================="

      - name: Generate Artifact Attestations (Sigstore Cryptographic Signatures)
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "scripta-${{ github.ref_name }}-web.zip"

      - name: Upload Build Artifacts (CI Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: scripta-${{ github.ref_name }}-dist
          path: |
            scripta-${{ github.ref_name }}-web.zip
            SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Scripta ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            scripta-${{ github.ref_name }}-web.zip
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
