<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Paper gradient -->
    <linearGradient id="paperBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Top binding gradient (Scripta signature Emerald Green) -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <!-- Pencil yellow-orange gradient -->
    <linearGradient id="pencilBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Subtle drop shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Main Document Base (Sổ văn bản) -->
  <g filter="url(#shadow)">
    <!-- Back Cover (Đế bìa sau xanh đen) -->
    <rect x="7" y="5" width="46" height="54" rx="5" fill="#0f172a" />

    <!-- Sheet (Tờ giấy trước) -->
    <rect x="8" y="6" width="44" height="52" rx="4" fill="url(#paperBg)" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Top Binder Header (Gáy sổ xanh Scripta) -->
    <path d="M8 10 C8 7.8 9.8 6 12 6 L48 6 C50.2 6 52 7.8 52 10 L52 17 L8 17 Z" fill="url(#headerGrad)"/>
    <!-- Binder perforation / stitch line -->
    <line x1="8" y1="17" x2="52" y2="17" stroke="#166534" stroke-width="1"/>
    <!-- Binder ring clips -->
    <rect x="15" y="4" width="4" height="5" rx="1.5" fill="#f8fafc" stroke="#64748b" stroke-width="0.75"/>
    <rect x="26" y="4" width="4" height="5" rx="1.5" fill="#f8fafc" stroke="#64748b" stroke-width="0.75"/>
    <rect x="37" y="4" width="4" height="5" rx="1.5" fill="#f8fafc" stroke="#64748b" stroke-width="0.75"/>

    <!-- Red Margin Line (Đường kẻ lề đỏ) -->
    <line x1="18" y1="18" x2="18" y2="57" stroke="#f87171" stroke-width="1.2" stroke-opacity="0.75"/>

    <!-- Ruled Text / Code Lines (To, rõ ràng để thấy được ở 16x16) -->
    <!-- Line 1: Blue code tag -->
    <rect x="22" y="23" width="12" height="3" rx="1" fill="#3b82f6"/>
    <rect x="36" y="23" width="10" height="3" rx="1" fill="#64748b"/>

    <!-- Line 2: Green keyword -->
    <rect x="22" y="30" width="18" height="3" rx="1" fill="#10b981"/>

    <!-- Line 3: Purple & Orange -->
    <rect x="22" y="37" width="9" height="3" rx="1" fill="#8b5cf6"/>
    <rect x="33" y="37" width="11" height="3" rx="1" fill="#f59e0b"/>

    <!-- Line 4 -->
    <rect x="22" y="44" width="14" height="3" rx="1" fill="#64748b"/>
  </g>

  <!-- Scripta Pencil (Cây bút chì đặt chéo) -->
  <g transform="translate(14, 13) rotate(42)" filter="url(#shadow)">
    <!-- Eraser (Đầu tẩy hồng) -->
    <rect x="42" y="6" width="6" height="7" rx="1" fill="#f472b6"/>
    <!-- Metal band -->
    <rect x="40" y="6" width="2.5" height="7" fill="#94a3b8"/>
    <!-- Pencil Wooden Body -->
    <rect x="14" y="6" width="26" height="7" rx="0.5" fill="url(#pencilBody)"/>
    <!-- Pencil Lead / Tip (Đầu gọt gỗ & ngòi chì) -->
    <path d="M14 6 L7 9.5 L14 13 Z" fill="#fed7aa"/>
    <path d="M9.5 8.25 L7 9.5 L9.5 10.75 Z" fill="#334155"/>
  </g>
</svg>
